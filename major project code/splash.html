<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading LandGuard AI...</title>
  <style>
    body {
      margin: 0; padding: 0; background-color: #0a0a0f; color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden; border: 1px solid #10b981; border-radius: 12px;
      -webkit-app-region: drag;
    }
    .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #10b981; }
    .status { color: #9ca3af; font-size: 14px; margin-bottom: 20px; }
    .loader { width: 200px; height: 4px; background: #1f2937; position: relative; overflow: hidden; }
    .loader-bar { position: absolute; top: 0; left: 0; height: 100%; width: 30%; background: #10b981; animation: load 2s infinite ease-in-out; }
    @keyframes load { 0% { left: -30%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <div class="title">LandGuard AI</div>
  <div class="status">Initializing Services...</div>
  <div class="loader"><div class="loader-bar"></div></div>
</body>
</html>
